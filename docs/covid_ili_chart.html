    let fullSeries = [];
    let currentWeeks = 0;

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/);
      const header = lines[0].replace(/^\ufeff/, "").split(",");
      const idxDate = header.indexOf("reference_date");
      const idxIli = header.indexOf("ili_percent");
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",");
        if (cols.length <= Math.max(idxDate, idxIli)) continue;
        const ili = parseFloat(cols[idxIli]);
        if (Number.isNaN(ili)) continue;
        rows.push({ date: cols[idxDate], ili });
      }
      rows.sort((a, b) => a.date.localeCompare(b.date));
      return rows;
    }

    function rollingMean(values, window) {
      return values.map((_, i) => {
        const start = Math.max(0, i - window + 1);
        const slice = values.slice(start, i + 1);
        return slice.reduce((a, b) => a + b, 0) / slice.length;
      });
    }

    function buildSeries(rows) {
      const ili = rows.map(r => r.ili);
      const ma = rollingMean(ili, MA_WINDOW);
      return rows.map((r, i) => ({
        date: r.date,
        ili: r.ili,
        ma: ma[i],
      }));
    }

    function filterSeries(series, weeks) {
      if (!weeks || weeks <= 0) return series;
      const cutoff = series.length - weeks;
      return series.slice(Math.max(0, cutoff));
    }

    function render(series) {
      const dates = series.map(r => r.date);
      const latest = series[series.length - 1];
      document.getElementById("summary").textContent =
        `最新 ${latest.date} · ILI ${latest.ili.toFixed(1)}% · 5周均值 ${latest.ma.toFixed(1)}% · 共 ${series.length} 周`;

      const weekly = {
        x: dates,
        y: series.map(r => r.ili),
        type: "scatter",
        mode: "lines+markers",
        name: "ILI% (周值)",
        line: { color: "#93c5fd", width: 1.5 },
        marker: { size: 4, color: "#93c5fd" },
        hovertemplate: "%{x}<br>ILI: %{y:.1f}%<extra></extra>",
      };

      const maTrace = {
        x: dates,
        y: series.map(r => r.ma),
        type: "scatter",
        mode: "lines+markers",
        name: `ILI% (滑动${MA_WINDOW}周)`,
        line: { color: "#2563eb", width: 2.5 },
        marker: { size: 5, color: "#2563eb" },
        hovertemplate: "%{x}<br>5周均值: %{y:.1f}%<extra></extra>",
      };

      const layout = {
        margin: { t: 24, r: 24, b: 56, l: 56 },
        hovermode: "x unified",
        xaxis: { title: "日期", tickformat: "%Y-%m", gridcolor: "#e2e8f0" },
        yaxis: { title: "阳性率 (%)", gridcolor: "#e2e8f0", rangemode: "tozero" },
        legend: { orientation: "h", y: -0.18 },
        paper_bgcolor: "#fff",
        plot_bgcolor: "#fff",
      };

      Plotly.newPlot("chart", [weekly, maTrace], layout, { responsive: true, displayModeBar: true });
    }

    function redraw() {
      render(filterSeries(fullSeries, currentWeeks));
    }

    async function loadData() {
      const status = document.getElementById("status");
      try {
        status.textContent = "正在从 GitHub 加载最新 CSV…";
        const resp = await fetch(CSV_URL, { cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        fullSeries = buildSeries(parseCsv(await resp.text()));
        status.textContent = "数据来源: " + CSV_URL;
      } catch (err) {
        console.warn("fetch failed, using embedded fallback", err);
        fullSeries = buildSeries(FALLBACK);
        status.textContent = "在线 CSV 加载失败，已使用生成时的本地快照。";
      }
      redraw();
    }

    document.querySelectorAll(".controls button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentWeeks = Number(btn.dataset.weeks || 0);
        redraw();
      });
    });

    loadData();
  </script>
